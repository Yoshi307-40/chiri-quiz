<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>中1 英単語</title>
<style>
  :root {
    --ground: #F4F7FC;
    --surface: #FFFFFF;
    --surface-2: #E7EDF8;
    --ink: #1A1F2B;
    --ink-soft: #5A6274;
    --line: #D6DDEC;
    --accent: #2563C9;
    --accent-ink: #F7F8FB;
    --accent-soft: #DCE8FB;
    --contour: #C9682F;
    --ok: #1E8A52;
    --ok-soft: #D6F2E0;
    --ng: #C7452F;
    --ng-soft: #FCE2DC;
    --radius: 10px;
    --font-display: "Yu Mincho", YuMincho, "Hiragino Mincho ProN", "Noto Serif JP", serif;
    --font-en: Georgia, "Times New Roman", "Noto Serif", serif;
    --font-body: "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, "Noto Sans JP", system-ui, sans-serif;
    --font-num: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1319;
      --surface: #181D26;
      --surface-2: #222835;
      --ink: #E6E9EF;
      --ink-soft: #99A2B3;
      --line: #2C3340;
      --accent: #7FA8E0;
      --accent-ink: #0F1620;
      --accent-soft: #1C2838;
      --contour: #D4896B;
      --ok: #74C48D;
      --ok-soft: #1C2E23;
      --ng: #E28E7C;
      --ng-soft: #33201C;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1319;
    --surface: #181D26;
    --surface-2: #222835;
    --ink: #E6E9EF;
    --ink-soft: #99A2B3;
    --line: #2C3340;
    --accent: #7FA8E0;
    --accent-ink: #0F1620;
    --accent-soft: #1C2838;
    --contour: #D4896B;
    --ok: #74C48D;
    --ok-soft: #1C2E23;
    --ng: #E28E7C;
    --ng-soft: #33201C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 34rem;
    margin: 0 auto;
    padding: 1.25rem 1.1rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    min-height: 100vh;
  }

  .screen { display: flex; flex-direction: column; gap: 1.5rem; }
  .screen[hidden] { display: none; }

  /* ---- 見出し ---- */
  .masthead { display: flex; flex-direction: column; gap: .35rem; }
  .eyebrow {
    font-size: .72rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--contour);
    font-family: var(--font-num);
  }
  h1 {
    font-family: var(--font-display);
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: .04em;
    margin: 0;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--ink-soft); font-size: .9rem; }
  .notice {
    font-size: .8rem;
    color: var(--contour);
    border: 1px dashed var(--contour);
    border-radius: var(--radius);
    padding: .6rem .8rem;
    line-height: 1.6;
  }

  /* ---- 設定ブロック ---- */
  .field { display: flex; flex-direction: column; gap: .6rem; }
  .field > .label {
    font-size: .78rem;
    letter-spacing: .12em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    padding-bottom: .35rem;
  }
  .choices { display: flex; flex-wrap: wrap; gap: .5rem; }

  .chip {
    font: inherit;
    font-size: .88rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .42rem .9rem;
    cursor: pointer;
    display: inline-flex;
    align-items: baseline;
    gap: .4rem;
  }
  .chip .count { font-family: var(--font-num); font-size: .78rem; color: var(--ink-soft); }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .chip[aria-pressed="true"] .count { color: var(--accent-ink); opacity: .75; }
  .chip:disabled { opacity: .4; cursor: default; }

  /* ---- ボタン ---- */
  .btn {
    font: inherit;
    font-size: 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    padding: .85rem 1rem;
    cursor: pointer;
    width: 100%;
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost.strong {
    border: 2px solid var(--accent);
    color: var(--accent);
    background: var(--surface);
    font-weight: 600;
  }
  .btn.small { font-size: .85rem; padding: .55rem .9rem; width: auto; }
  .btn-row { display: flex; gap: .6rem; }
  .btn-row > * { flex: 1; }

  button:focus-visible, .chip:focus-visible, input:focus-visible {
    outline: 2px solid var(--contour);
    outline-offset: 2px;
  }

  /* ---- 出題画面 ---- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    font-size: .78rem;
    color: var(--ink-soft);
  }
  .bar .cat { letter-spacing: .1em; }
  .bar .pos { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  .track { height: 3px; background: var(--surface-2); position: relative; }
  .track .fill { height: 100%; background: var(--accent); transition: width .25s ease; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.4rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  .qnum {
    font-family: var(--font-num);
    font-size: .78rem;
    color: var(--contour);
    letter-spacing: .1em;
  }
  .qtext {
    font-family: var(--font-display);
    font-size: 1.28rem;
    line-height: 1.85;
    margin: 0;
    text-wrap: pretty;
  }
  .qtext.en {
    font-family: var(--font-en);
    font-size: 2.1rem;
    line-height: 1.4;
    letter-spacing: .01em;
  }
  .say {
    font: inherit;
    font-size: .8rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: .25rem .8rem;
    cursor: pointer;
    align-self: flex-start;
  }
  .answer {
    border-top: 1px dashed var(--line);
    padding-top: 1rem;
    font-family: var(--font-display);
    font-size: 1.85rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .03em;
    animation: rise .22s ease-out;
  }
  .answer.en { font-family: var(--font-en); }
  @keyframes rise { from { opacity: 0; transform: translateY(.35rem); } to { opacity: 1; transform: none; } }

  .options { display: flex; flex-direction: column; gap: .55rem; }
  .option {
    font: inherit;
    text-align: left;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .8rem .95rem;
    cursor: pointer;
    display: flex;
    gap: .7rem;
    align-items: baseline;
  }
  .option .mark { font-family: var(--font-num); color: var(--ink-soft); font-size: .8rem; }
  .option.is-ok {
    background: var(--ok-soft);
    border-color: var(--ok);
    border-width: 2px;
    color: var(--ok);
    font-weight: 700;
  }
  .option.is-ng { background: var(--ng-soft); border-color: var(--ng); color: var(--ng); }
  .option:disabled { cursor: default; }

  /* ---- スペル入力 ---- */
  .spell { display: flex; flex-direction: column; gap: .7rem; }
  .spell input {
    font-family: var(--font-en);
    font-size: 1.5rem;
    padding: .7rem .8rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--ground);
    color: var(--ink);
    width: 100%;
    text-align: center;
  }
  .hint {
    font-family: var(--font-num);
    font-size: 1.1rem;
    color: var(--ink-soft);
    letter-spacing: .3em;
    text-align: center;
    min-height: 1.6rem;
  }
  .yours { font-size: .85rem; color: var(--ink-soft); }
  .yours b { font-family: var(--font-en); color: var(--ng); font-weight: 600; }

  .judge {
    font-size: 1.1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: .55rem;
    flex-wrap: wrap;
    padding: .8rem 1rem;
    border-radius: var(--radius);
    border: 2px solid transparent;
  }
  .judge .big-mark { font-size: 1.75rem; line-height: 1; }
  .judge.ok { color: var(--ok); background: var(--ok-soft); border-color: var(--ok); }
  .judge.ng { color: var(--ng); background: var(--ng-soft); border-color: var(--ng); }
  .judge .right { font-family: var(--font-display); font-size: 1.25rem; }
  .judge .en { font-family: var(--font-en); font-size: 1.1rem; }

  /* ---- 結果画面 ---- */
  .score {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    font-family: var(--font-num);
  }
  .score .big { font-size: 3.2rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .score .sub { color: var(--ink-soft); font-size: .9rem; }

  .review { display: flex; flex-direction: column; gap: .1rem; }
  .review .row {
    display: flex;
    gap: .8rem;
    padding: .7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: .9rem;
    align-items: baseline;
  }
  .review .row .n { font-family: var(--font-num); color: var(--contour); font-size: .78rem; }
  .review .row .q { flex: 1; font-family: var(--font-en); font-size: 1.05rem; }
  .review .row .a { color: var(--ink-soft); text-align: right; }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    font-size: .82rem;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: .9rem;
  }
  .stats b { font-family: var(--font-num); font-size: 1.05rem; color: var(--ink); font-weight: 500; }
  .stats .cell { display: flex; flex-direction: column; }
  .linkish {
    font: inherit;
    font-size: .8rem;
    background: none;
    border: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    align-self: flex-start;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">

  <!-- ホーム -->
  <section class="screen" id="home">
    <div class="masthead">
      <span class="eyebrow">English Words</span>
      <h1>中1 英単語</h1>
      <p class="lede" id="homeLede"></p>
    </div>

    <p class="notice" id="sampleNotice">
      いまの単語は教科書そのものではなく、中1で広く共通して出てくる基本の単語です。教科書（NEW CROWN）の写真を用意できたら、習った順（Lesson別）に並べかえて、足りない単語を足します。それまでの記録はそのまま残ります。
    </p>

    <div class="field">
      <span class="label">はんい</span>
      <div class="choices" id="rangeChoices"></div>
    </div>

    <div class="field">
      <span class="label">出題数</span>
      <div class="choices" id="countChoices"></div>
    </div>

    <div class="field">
      <span class="label">やり方</span>
      <div class="choices" id="modeChoices">
        <button class="chip" data-mode="quiz">意味を4つから選ぶ</button>
        <button class="chip" data-mode="flash">意味を思い出す</button>
        <button class="chip" data-mode="spell">スペルを書く</button>
      </div>
    </div>

    <button class="btn" id="startBtn">はじめる</button>

    <div class="stats" id="homeStats"></div>
  </section>

  <!-- 出題 -->
  <section class="screen" id="play" hidden>
    <div class="bar">
      <span class="cat" id="playCat"></span>
      <span class="pos" id="playPos"></span>
    </div>
    <div class="track"><div class="fill" id="playFill" style="width:0%"></div></div>

    <div class="card">
      <div class="qnum" id="playNum"></div>
      <p class="qtext" id="playQ"></p>
      <div id="playSay"></div>
      <div id="playAnswer"></div>
      <div class="options" id="playOptions"></div>
    </div>

    <div id="playControls"></div>
    <button class="btn ghost strong" id="quitBtn">ホームにもどる</button>
  </section>

  <!-- 結果 -->
  <section class="screen" id="result" hidden>
    <div class="masthead">
      <span class="eyebrow">Result</span>
      <h1 id="resultTitle">おつかれさま</h1>
    </div>

    <div class="score">
      <span class="big" id="scoreBig">0</span>
      <span class="sub" id="scoreSub"></span>
    </div>

    <div class="field" id="missBlock">
      <span class="label">まちがえた単語</span>
      <div class="review" id="missList"></div>
    </div>

    <div class="btn-row">
      <button class="btn" id="againBtn">まちがえた単語をもう一度</button>
    </div>
    <button class="btn ghost strong" id="homeBtn">ホームにもどる</button>
  </section>

</div>

const WORDS = RAW.map((w, i) => ({ n: i + 1, l: w.l, en: w.en, ja: w.ja }));

const GROUPS = WORDS.reduce((acc, w) => (acc.includes(w.l) ? acc : acc.concat([w.l])), []);

const KEY = 'eigo1.v2';
const $ = id => document.getElementById(id);

let store = load();
let setting = { range: 'all', count: 10, mode: 'quiz' };
let session = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { stats: {} };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
}
function stat(n) {
  if (!store.stats[n]) store.stats[n] = { ok: 0, ng: 0, streak: 0 };
  return store.stats[n];
}
function isWeak(n) {
  const s = store.stats[n];
  return !!s && s.ng > 0 && s.streak < 2;
}
function weakList() {
  return WORDS.filter(w => isWeak(w.en));
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pool(range) {
  if (range === 'all') return WORDS.slice();
  if (range === 'weak') return weakList();
  return WORDS.filter(w => w.l === range);
}

/* 読み上げ。対応していない端末では黙って何もしない */
function canSpeak() {
  return typeof window.speechSynthesis !== 'undefined';
}
function speak(text) {
  if (!canSpeak()) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function sayButton(text, label) {
  const b = document.createElement('button');
  b.className = 'say';
  b.type = 'button';
  b.textContent = label || '🔊 発音を聞く';
  b.onclick = () => speak(text);
  return b;
}

/* スペル判定。大文字小文字と前後の空白は不問 */
function normalize(s) {
  return s.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');
}

/* ---------- ホーム ---------- */
function renderHome() {
  $('sampleNotice').hidden = !SAMPLE;
  $('homeLede').textContent = '全' + WORDS.length + '語。はんいとやり方を選んで始めます。';

  const ranges = [{ key: 'all', label: '全部' }]
    .concat(GROUPS.map(g => ({ key: g, label: g })))
    .concat([{ key: 'weak', label: '苦手だけ' }]);

  const rc = $('rangeChoices');
  rc.innerHTML = '';
  ranges.forEach(r => {
    const n = pool(r.key).length;
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(setting.range === r.key));
    b.innerHTML = '<span>' + r.label + '</span><span class="count">' + n + '</span>';
    b.disabled = n === 0;
    b.onclick = () => { setting.range = r.key; renderHome(); };
    rc.appendChild(b);
  });

  const max = pool(setting.range).length;
  const cc = $('countChoices');
  cc.innerHTML = '';
  [10, 20, 'all'].forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c === 'all' ? 'ぜんぶ（' + max + '語）' : c + '語';
    b.disabled = c !== 'all' && max < c;
    b.setAttribute('aria-pressed', String(setting.count === c));
    b.onclick = () => { setting.count = c; renderHome(); };
    cc.appendChild(b);
  });
  if (setting.count !== 'all' && max < setting.count) setting.count = 'all';

  Array.from($('modeChoices').children).forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.mode === setting.mode));
    b.onclick = () => { setting.mode = b.dataset.mode; renderHome(); };
  });

  const done = Object.keys(store.stats).length;
  const totalOk = Object.values(store.stats).reduce((s, v) => s + v.ok, 0);
  const totalNg = Object.values(store.stats).reduce((s, v) => s + v.ng, 0);
  const rate = totalOk + totalNg ? Math.round(totalOk * 100 / (totalOk + totalNg)) : 0;
  $('homeStats').innerHTML =
    '<span class="cell">これまでの正答率<b>' + rate + '%</b></span>' +
    '<span class="cell">やった単語<b>' + done + ' / ' + WORDS.length + '</b></span>' +
    '<span class="cell">苦手<b>' + weakList().length + '語</b></span>';
  if (done) {
    const reset = document.createElement('button');
    reset.className = 'linkish';
    reset.textContent = '記録を消す';
    reset.onclick = () => {
      if (confirm('これまでの正誤の記録を全部消します。よろしいですか？')) {
        store = { stats: {} }; save(); renderHome();
      }
    };
    $('homeStats').appendChild(reset);
  }
}

/* ---------- 出題 ---------- */
function show(screen) {
  ['home', 'play', 'result'].forEach(id => { $(id).hidden = id !== screen; });
  window.scrollTo(0, 0);
}

function start(list) {
  session = { list: list, i: 0, miss: [], okCount: 0 };
  show('play');
  renderQuestion();
}

function startFromSetting() {
  let list = shuffle(pool(setting.range));
  if (setting.count !== 'all') list = list.slice(0, setting.count);
  start(list);
}

function makeOptions(w) {
  const same = WORDS.filter(x => x.l === w.l && x.n !== w.n);
  const others = shuffle(same).slice(0, 3).map(x => x.ja);
  while (others.length < 3) {
    const pick = WORDS[Math.floor(Math.random() * WORDS.length)].ja;
    if (pick !== w.ja && !others.includes(pick)) others.push(pick);
  }
  return shuffle(others.concat([w.ja]));
}

function renderQuestion() {
  const w = session.list[session.i];
  $('playCat').textContent = w.l;
  $('playPos').textContent = (session.i + 1) + ' / ' + session.list.length;
  $('playFill').style.width = (session.i / session.list.length * 100) + '%';
  $('playNum').textContent = 'No.' + w.n + (isWeak(w.en) ? '　苦手' : '');
  $('playAnswer').innerHTML = '';
  $('playOptions').innerHTML = '';
  $('playControls').innerHTML = '';
  $('playSay').innerHTML = '';

  if (setting.mode === 'spell') renderSpell(w);
  else if (setting.mode === 'flash') renderFlash(w);
  else renderQuiz(w);
}

/* 英語を見て意味を思い出す */
function renderFlash(w) {
  $('playQ').className = 'qtext en';
  $('playQ').textContent = w.en;
  if (canSpeak()) $('playSay').appendChild(sayButton(w.en));

  const reveal = document.createElement('button');
  reveal.className = 'btn';
  reveal.textContent = '意味を見る';
  reveal.onclick = () => {
    $('playAnswer').innerHTML = '<div class="answer">' + w.ja + '</div>';
    const row = document.createElement('div');
    row.className = 'btn-row';
    const ok = document.createElement('button');
    ok.className = 'btn';
    ok.textContent = '○ できた';
    ok.onclick = () => grade(w, true);
    const ng = document.createElement('button');
    ng.className = 'btn ghost';
    ng.textContent = '× まちがえた';
    ng.onclick = () => grade(w, false);
    row.append(ok, ng);
    $('playControls').innerHTML = '';
    $('playControls').appendChild(row);
  };
  $('playControls').appendChild(reveal);
}

/* 英語を見て意味を4択で選ぶ */
function renderQuiz(w) {
  $('playQ').className = 'qtext en';
  $('playQ').textContent = w.en;
  if (canSpeak()) $('playSay').appendChild(sayButton(w.en));

  const opts = makeOptions(w);
  const box = $('playOptions');
  opts.forEach((text, idx) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.innerHTML = '<span class="mark">' + (idx + 1) + '</span><span>' + text + '</span>';
    b.onclick = () => {
      const correct = text === w.ja;
      Array.from(box.children).forEach((el, i) => {
        el.disabled = true;
        if (opts[i] === w.ja) el.classList.add('is-ok');
        else if (i === idx) el.classList.add('is-ng');
      });
      if (!correct && navigator.vibrate) navigator.vibrate(40);
      const judge = document.createElement('div');
      judge.className = 'judge ' + (correct ? 'ok' : 'ng');
      judge.innerHTML = correct
        ? '<span class="big-mark">○</span>正解！'
        : '<span class="big-mark">×</span>正解は<span class="right">' + w.ja + '</span>';
      const next = document.createElement('button');
      next.className = 'btn';
      next.textContent = session.i + 1 < session.list.length ? '次の単語へ' : '結果を見る';
      next.onclick = () => grade(w, correct);
      $('playControls').append(judge, next);
      next.focus();
    };
    box.appendChild(b);
  });
}

/* 意味を見てスペルを書く */
function renderSpell(w) {
  $('playQ').className = 'qtext';
  $('playQ').textContent = w.ja;

  const box = document.createElement('form');
  box.className = 'spell';
  box.onsubmit = e => { e.preventDefault(); check(); };

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = w.en.replace(/[A-Za-z]/g, '_').split('').join(' ');

  const input = document.createElement('input');
  input.type = 'text';
  input.autocapitalize = 'off';
  input.autocorrect = 'off';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.placeholder = 'ここに英語を入力';

  const submit = document.createElement('button');
  submit.className = 'btn';
  submit.type = 'submit';
  submit.textContent = 'こたえあわせ';

  const giveup = document.createElement('button');
  giveup.className = 'linkish';
  giveup.type = 'button';
  giveup.textContent = 'わからないので答えを見る';
  giveup.onclick = () => finish(false, input.value);

  box.append(hint, input, submit, giveup);
  $('playControls').appendChild(box);
  input.focus();

  function check() {
    finish(normalize(input.value) === normalize(w.en), input.value);
  }

  function finish(correct, typed) {
    input.disabled = true;
    submit.hidden = true;
    giveup.hidden = true;
    if (!correct && navigator.vibrate) navigator.vibrate(40);

    $('playAnswer').innerHTML = '<div class="answer en">' + w.en + '</div>';
    $('playSay').innerHTML = '';
    if (canSpeak()) $('playSay').appendChild(sayButton(w.en));

    const judge = document.createElement('div');
    judge.className = 'judge ' + (correct ? 'ok' : 'ng');
    judge.innerHTML = correct
      ? '<span class="big-mark">○</span>正解！'
      : '<span class="big-mark">×</span>ちがいます';
    if (!correct && typed.trim()) {
      const yours = document.createElement('span');
      yours.className = 'yours';
      yours.innerHTML = 'あなたの答え: <b>' + typed.trim() + '</b>';
      judge.appendChild(yours);
    }

    const next = document.createElement('button');
    next.className = 'btn';
    next.textContent = session.i + 1 < session.list.length ? '次の単語へ' : '結果を見る';
    next.onclick = () => grade(w, correct);

    $('playControls').append(judge, next);
    next.focus();
  }
}

function grade(w, correct) {
  const s = stat(w.en);
  if (correct) { s.ok++; s.streak++; session.okCount++; }
  else { s.ng++; s.streak = 0; session.miss.push(w); }
  save();
  session.i++;
  if (session.i < session.list.length) renderQuestion();
  else renderResult();
}

/* ---------- 結果 ---------- */
function renderResult() {
  show('result');
  const total = session.list.length;
  const ok = session.okCount;
  const rate = Math.round(ok * 100 / total);
  $('scoreBig').textContent = rate + '%';
  $('scoreSub').textContent = total + '語中 ' + ok + '語 正解';
  $('resultTitle').textContent = rate === 100 ? '全問正解！' : (rate >= 80 ? 'いい調子' : 'もう一周いこう');

  const list = $('missList');
  list.innerHTML = '';
  if (session.miss.length === 0) {
    $('missBlock').hidden = true;
    $('againBtn').hidden = true;
  } else {
    $('missBlock').hidden = false;
    $('againBtn').hidden = false;
    $('againBtn').textContent = 'まちがえた' + session.miss.length + '語をもう一度';
    session.miss.forEach(w => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="n">' + w.n + '</span><span class="q">' + w.en + '</span><span class="a">' + w.ja + '</span>';
      if (canSpeak()) {
        const b = sayButton(w.en, '🔊');
        row.appendChild(b);
      }
      list.appendChild(row);
    });
  }
}

/* ---------- 起動 ---------- */
$('startBtn').onclick = startFromSetting;
$('quitBtn').onclick = () => { renderHome(); show('home'); };
$('homeBtn').onclick = () => { renderHome(); show('home'); };
$('againBtn').onclick = () => start(shuffle(session.miss));

renderHome();
</script>
