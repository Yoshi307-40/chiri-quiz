<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0E13">
<title>中1 英単語</title>
<style>
  :root {
    --bg: #0A0E13;
    --surface: #141C25;
    --surface-2: #1C2733;
    --line: #27353F;
    --ink: #E8EFF6;
    --ink-dim: #8697A8;
    --accent: #C084FC;
    --accent-glow: rgba(192, 132, 252, .45);
    --accent-dim: rgba(192, 132, 252, .12);
    --ok: #4ADE80;
    --ok-glow: rgba(74, 222, 128, .4);
    --ng: #FB7185;
    --gold: #FBBF24;
    --radius: 14px;
    --font-ui: "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, "Noto Sans JP", system-ui, sans-serif;
    --font-num: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(900px 500px at 50% -10%, rgba(192, 132, 252, .10), transparent 70%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 32rem;
    margin: 0 auto;
    padding: 1rem 1rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    min-height: 100vh;
  }

  .screen { display: flex; flex-direction: column; gap: 1.25rem; }
  .screen[hidden] { display: none; }

  /* ---- 上部ステータス ---- */
  .hud {
    display: flex;
    align-items: center;
    gap: .7rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .7rem .85rem;
  }
  .hud .lv {
    font-family: var(--font-num);
    font-size: .95rem;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 14px var(--accent-glow);
    white-space: nowrap;
  }
  .hud .xpwrap { flex: 1; display: flex; flex-direction: column; gap: .25rem; }
  .hud .xpbar {
    height: 6px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
  }
  .hud .xpfill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #E9D5FF);
    box-shadow: 0 0 12px var(--accent-glow);
    transition: width .4s ease;
  }
  .hud .xptext { font-family: var(--font-num); font-size: .68rem; color: var(--ink-dim); }
  .hud .fire {
    font-family: var(--font-num);
    font-size: .8rem;
    color: var(--gold);
    white-space: nowrap;
  }

  /* ---- 見出し ---- */
  .masthead { display: flex; flex-direction: column; gap: .2rem; }
  .eyebrow {
    font-family: var(--font-num);
    font-size: .68rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: .85;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: .02em;
    margin: 0;
    line-height: 1.3;
  }
  .lede { margin: 0; color: var(--ink-dim); font-size: .85rem; }

  /* ---- セクション ---- */
  .field { display: flex; flex-direction: column; gap: .55rem; }
  .field > .label {
    font-size: .7rem;
    letter-spacing: .18em;
    color: var(--ink-dim);
    font-family: var(--font-num);
    text-transform: uppercase;
  }
  .choices { display: flex; flex-wrap: wrap; gap: .45rem; }

  .chip {
    font: inherit;
    font-size: .85rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: .45rem .9rem;
    cursor: pointer;
    display: inline-flex;
    align-items: baseline;
    gap: .4rem;
    transition: border-color .15s, background .15s;
  }
  .chip .count { font-family: var(--font-num); font-size: .72rem; color: var(--ink-dim); }
  .chip[aria-pressed="true"] {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 18px -4px var(--accent-glow);
  }
  .chip[aria-pressed="true"] .count { color: var(--accent); opacity: .8; }
  .chip:disabled { opacity: .35; cursor: default; }

  /* ---- ボタン ---- */
  .btn {
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent), #7C3AED);
    color: #1E0B33;
    padding: .95rem 1rem;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 0 24px -6px var(--accent-glow);
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    box-shadow: none;
  }
  .btn.quiet {
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    box-shadow: none;
    font-weight: 500;
  }
  .btn-row { display: flex; gap: .5rem; }
  .btn-row > * { flex: 1; }
  button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- バッジ棚 ---- */
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: .5rem; }
  .badge {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .55rem .3rem;
    text-align: center;
    font-size: .62rem;
    color: var(--ink-dim);
    line-height: 1.4;
  }
  .badge .ico { font-size: 1.3rem; display: block; filter: grayscale(1); opacity: .35; }
  .badge.got {
    border-color: var(--gold);
    background: rgba(251, 191, 36, .08);
    color: var(--gold);
  }
  .badge.got .ico { filter: none; opacity: 1; }

  /* ---- 出題画面 ---- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    font-size: .72rem;
    color: var(--ink-dim);
    font-family: var(--font-num);
  }
  .track { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .track .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #E9D5FF);
    box-shadow: 0 0 10px var(--accent-glow);
    transition: width .3s ease;
  }

  .combo {
    text-align: center;
    font-family: var(--font-num);
    font-weight: 700;
    color: var(--gold);
    min-height: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
  }
  .combo .num { font-size: 1.9rem; line-height: 1; text-shadow: 0 0 18px rgba(251, 191, 36, .6); }
  .combo .lbl { font-size: .7rem; letter-spacing: .2em; }
  .combo.pop .num { animation: pop .28s ease-out; }
  @keyframes pop { 0% { transform: scale(.6); opacity: .3; } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.3rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .qnum { font-family: var(--font-num); font-size: .68rem; color: var(--accent); letter-spacing: .12em; opacity: .8; }
  .qtext { font-size: 1.15rem; line-height: 1.8; margin: 0; font-weight: 500; }
  .answer {
    border-top: 1px solid var(--line);
    padding-top: .9rem;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 22px var(--accent-glow);
  }

  .options { display: flex; flex-direction: column; gap: .5rem; }
  .option {
    font: inherit;
    font-size: .95rem;
    text-align: left;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .85rem .9rem;
    cursor: pointer;
    display: flex;
    gap: .7rem;
    align-items: baseline;
    transition: border-color .15s, background .15s;
  }
  .option .mark { font-family: var(--font-num); color: var(--ink-dim); font-size: .75rem; }
  .option.is-ok {
    background: rgba(74, 222, 128, .14);
    border-color: var(--ok);
    color: var(--ok);
    font-weight: 700;
    box-shadow: 0 0 26px -6px var(--ok-glow);
  }
  .option.is-ng { background: rgba(251, 113, 133, .12); border-color: var(--ng); color: var(--ng); }
  .option:disabled { cursor: default; }

  /* ---- 英単語用 ---- */
  .notice {
    font-size: .76rem;
    color: var(--gold);
    border: 1px dashed rgba(251, 191, 36, .45);
    border-radius: 12px;
    padding: .6rem .8rem;
    line-height: 1.6;
    margin: 0;
  }
  .say {
    font: inherit;
    font-size: .76rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--accent);
    border-radius: 99px;
    padding: .3rem .85rem;
    cursor: pointer;
    align-self: flex-start;
  }
  .qtext.en { font-size: 2rem; font-weight: 800; letter-spacing: .01em; }
  .spell { display: flex; flex-direction: column; gap: .7rem; }
  .spell input {
    font-family: var(--font-num);
    font-size: 1.35rem;
    padding: .75rem .8rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    width: 100%;
    text-align: center;
  }
  .spell input:focus { border-color: var(--accent); outline: none; }
  .hint {
    font-family: var(--font-num);
    font-size: 1.05rem;
    color: var(--ink-dim);
    letter-spacing: .3em;
    text-align: center;
    min-height: 1.4rem;
  }
  .yours { font-size: .78rem; color: var(--ink-dim); font-weight: 500; }
  .yours b { color: var(--ng); font-weight: 700; }

  .judge {
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-wrap: wrap;
    font-size: 1rem;
    font-weight: 700;
    padding: .85rem 1rem;
    border-radius: var(--radius);
    border: 1.5px solid transparent;
  }
  .judge .big-mark { font-size: 1.7rem; line-height: 1; }
  .judge .right { font-weight: 800; }
  .judge .xp { font-family: var(--font-num); font-size: .78rem; margin-left: auto; opacity: .9; }
  .judge.ok { color: var(--ok); background: rgba(74, 222, 128, .12); border-color: var(--ok); }
  .judge.ng { color: var(--ng); background: rgba(251, 113, 133, .1); border-color: var(--ng); }

  /* ---- 結果画面 ---- */
  .score { display: flex; align-items: baseline; gap: .6rem; font-family: var(--font-num); }
  .score .big {
    font-size: 3.4rem;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 30px var(--accent-glow);
  }
  .score .sub { color: var(--ink-dim); font-size: .85rem; }

  .gains { display: flex; gap: .5rem; }
  .gain {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .7rem .5rem;
    text-align: center;
  }
  .gain b { display: block; font-family: var(--font-num); font-size: 1.35rem; color: var(--accent); }
  .gain span { font-size: .66rem; color: var(--ink-dim); }

  .newbadge {
    border: 1.5px solid var(--gold);
    background: rgba(251, 191, 36, .1);
    border-radius: var(--radius);
    padding: .85rem 1rem;
    color: var(--gold);
    font-weight: 700;
    font-size: .9rem;
  }
  .newbadge .list { font-weight: 500; font-size: .82rem; margin-top: .2rem; }

  .review { display: flex; flex-direction: column; }
  .review .row {
    display: grid;
    grid-template-columns: 2.2rem 1fr;
    gap: .2rem .6rem;
    padding: .7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: .85rem;
  }
  .review .row .n { font-family: var(--font-num); font-size: .7rem; color: var(--accent); opacity: .7; grid-row: 1 / span 2; }
  .review .row .q { color: var(--ink-dim); }
  .review .row .a { color: var(--ok); font-weight: 700; }

  .levelup {
    position: fixed;
    left: 50%;
    top: 22%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1.5px solid var(--gold);
    color: var(--gold);
    padding: 1rem 1.6rem;
    border-radius: var(--radius);
    font-weight: 800;
    text-align: center;
    box-shadow: 0 0 40px -8px rgba(251, 191, 36, .7);
    animation: lvin .4s ease-out;
    z-index: 10;
  }
  .levelup .n { font-family: var(--font-num); font-size: 2rem; display: block; }
  @keyframes lvin { from { opacity: 0; transform: translateX(-50%) scale(.7); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 1.1rem;
    font-size: .76rem;
    color: var(--ink-dim);
    border-top: 1px solid var(--line);
    padding-top: .8rem;
  }
  .stats b { display: block; font-family: var(--font-num); font-size: 1rem; color: var(--ink); font-weight: 600; }
  .linkish {
    font: inherit;
    font-size: .76rem;
    background: none;
    border: none;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">

  <!-- ホーム -->
  <section class="screen" id="home">
    <div class="hud">
      <span class="lv" id="hudLv">Lv.1</span>
      <span class="xpwrap">
        <span class="xpbar"><span class="xpfill" id="hudXpFill" style="width:0%"></span></span>
        <span class="xptext" id="hudXpText">0 / 100 XP</span>
      </span>
      <span class="fire" id="hudFire"></span>
    </div>

    <div class="masthead">
      <span class="eyebrow">English Words</span>
      <h1>中1 英単語</h1>
      <p class="lede" id="homeLede"></p>
    <p class="notice" id="sampleNotice"></p>
    </div>

    <div class="field">
      <span class="label">はんい</span>
      <div class="choices" id="rangeChoices"></div>
    </div>

    <div class="field">
      <span class="label">出題数</span>
      <div class="choices" id="countChoices"></div>
    </div>

    <div class="field">
      <span class="label">やり方</span>
      <div class="choices" id="modeChoices">
        <button class="chip" data-mode="quiz">意味を4つから選ぶ</button>
        <button class="chip" data-mode="flash">意味を思い出す</button>
        <button class="chip" data-mode="spell">スペルを書く</button>
      </div>
    </div>

    <button class="btn" id="startBtn">はじめる</button>

    <div class="field">
      <span class="label">バッジ <span id="badgeCount"></span></span>
      <div class="badges" id="badgeShelf"></div>
    </div>

    <div class="stats" id="homeStats"></div>
    <div class="btn-row">
      <button class="btn quiet" id="soundBtn">音: ON</button>
      <button class="btn quiet" id="resetBtn">記録を消す</button>
    </div>
  </section>

  <!-- 出題 -->
  <section class="screen" id="play" hidden>
    <div class="bar">
      <span id="playCat"></span>
      <span id="playPos"></span>
    </div>
    <div class="track"><div class="fill" id="playFill" style="width:0%"></div></div>

    <div class="combo" id="combo"></div>

    <div class="card">
      <div class="qnum" id="playNum"></div>
      <p class="qtext" id="playQ"></p>
      <div id="playSay"></div>
      <div id="playAnswer"></div>
      <div class="options" id="playOptions"></div>
    </div>

    <div id="playControls"></div>
    <button class="btn quiet" id="quitBtn">ホームにもどる</button>
  </section>

  <!-- 結果 -->
  <section class="screen" id="result" hidden>
    <div class="masthead">
      <span class="eyebrow">Result</span>
      <h1 id="resultTitle">おつかれさま</h1>
    </div>

    <div class="score">
      <span class="big" id="scoreBig">0</span>
      <span class="sub" id="scoreSub"></span>
    </div>

    <div class="gains">
      <div class="gain"><b id="gainXp">0</b><span>かくとく XP</span></div>
      <div class="gain"><b id="gainCombo">0</b><span>さいだい コンボ</span></div>
      <div class="gain"><b id="gainLv">1</b><span>いまの レベル</span></div>
    </div>

    <div class="newbadge" id="newBadge" hidden></div>

    <div class="field" id="missBlock">
      <span class="label">まちがえた問題</span>
      <div class="review" id="missList"></div>
    </div>

    <button class="btn" id="againBtn">まちがえた問題をもう一度</button>
    <button class="btn ghost" id="homeBtn">ホームにもどる</button>
  </section>

</div>

const GROUPS = WORDS.reduce((acc, w) => (acc.includes(w.l) ? acc : acc.concat([w.l])), []);

const KEY = 'eigo.v3';
const OLD_KEY = 'eigo1.v2';
const $ = id => document.getElementById(id);

/* ---------- 保存 ---------- */
function blank() {
  return {
    v: 3, stats: {}, xp: 0, badges: {}, maxCombo: 0,
    totalAnswered: 0, totalCorrect: 0, perfectRuns: 0, spellCorrect: 0,
    streakDays: 0, lastDay: '', sound: true
  };
}
function load() {
  const s = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(s, JSON.parse(raw));
    const old = localStorage.getItem(OLD_KEY);
    if (old) s.stats = (JSON.parse(old).stats) || {};
  } catch (e) {}
  return s;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
}

let store = load();
let setting = { range: 'all', count: 10, mode: 'quiz' };
let session = null;

/* ---------- 音（ファイル不要。その場で合成する） ---------- */
let ac = null;
function audioCtx() {
  if (ac) return ac;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ac = new AC();
  } catch (e) { ac = null; }
  return ac;
}
function beep(freqs, dur, type, vol) {
  if (!store.sound) return;
  const c = audioCtx();
  if (!c) return;
  if (c.state === 'suspended') c.resume();
  freqs.forEach((f, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.value = f;
    const t = c.currentTime + i * dur * 0.55;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  });
}
const SFX = {
  ok(combo) {
    const base = 620 * Math.pow(1.055, Math.min(combo, 12));
    beep([base, base * 1.5], 0.13, 'triangle', 0.15);
  },
  ng() { beep([200, 150], 0.17, 'sawtooth', 0.09); },
  level() { beep([523, 659, 784, 1047], 0.16, 'triangle', 0.15); },
  badge() { beep([880, 1175, 1568], 0.15, 'sine', 0.13); }
};

/* ---------- 発音（端末の読み上げ機能。使えない端末ではボタンを出さない） ---------- */
function canSpeak() { return typeof window.speechSynthesis !== 'undefined'; }
function speak(text) {
  if (!canSpeak()) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function sayButton(text, label) {
  const b = document.createElement('button');
  b.className = 'say';
  b.type = 'button';
  b.textContent = label || '🔊 発音を聞く';
  b.onclick = () => speak(text);
  return b;
}

/* ---------- レベル ---------- */
function levelOf(xp) {
  let lv = 1, acc = 0, need = 100;
  while (xp >= acc + need) { acc += need; lv++; need = 100 + (lv - 1) * 50; }
  return { level: lv, inLevel: xp - acc, need: need };
}

/* ---------- バッジ ---------- */
function knownCount() {
  return WORDS.filter(w => (store.stats[w.en] || {}).ok > 0).length;
}
const BADGES = [
  { id: 'first',    ico: '🌱', name: 'はじめの一歩', desc: '1問こたえる',          test: () => store.totalAnswered >= 1 },
  { id: 'q50',      ico: '📘', name: '50問',         desc: 'のべ50問',            test: () => store.totalAnswered >= 50 },
  { id: 'q200',     ico: '📚', name: '200問',        desc: 'のべ200問',           test: () => store.totalAnswered >= 200 },
  { id: 'q500',     ico: '🏛️', name: '500問',        desc: 'のべ500問',           test: () => store.totalAnswered >= 500 },
  { id: 'combo10',  ico: '🔥', name: '10れんぞく',   desc: '10問連続で正解',      test: () => store.maxCombo >= 10 },
  { id: 'combo20',  ico: '⚡', name: '20れんぞく',   desc: '20問連続で正解',      test: () => store.maxCombo >= 20 },
  { id: 'perfect',  ico: '💯', name: 'ノーミス',     desc: '10問以上を全問正解',  test: () => store.perfectRuns >= 1 },
  { id: 'lv5',      ico: '⭐', name: 'レベル5',      desc: 'レベル5になる',       test: () => levelOf(store.xp).level >= 5 },
  { id: 'lv10',     ico: '🌟', name: 'レベル10',     desc: 'レベル10になる',      test: () => levelOf(store.xp).level >= 10 },
  { id: 'day3',     ico: '📅', name: '3日れんぞく',  desc: '3日続けて勉強',       test: () => store.streakDays >= 3 },
  { id: 'day7',     ico: '🗓️', name: '7日れんぞく',  desc: '7日続けて勉強',       test: () => store.streakDays >= 7 },
  { id: 'spell30',  ico: '✍️', name: 'スペル30',     desc: 'スペルを30問正解',    test: () => store.spellCorrect >= 30 },
  { id: 'spell100', ico: '🖊️', name: 'スペル100',    desc: 'スペルを100問正解',   test: () => store.spellCorrect >= 100 },
  { id: 'half',     ico: '🎯', name: '半分おぼえた', desc: '半分の単語を正解',    test: () => knownCount() >= Math.ceil(WORDS.length / 2) },
  { id: 'allwords', ico: '👑', name: '全単語せいは', desc: '全部の単語を正解',    test: () => knownCount() >= WORDS.length }
];
function checkBadges() {
  const got = [];
  BADGES.forEach(b => {
    if (!store.badges[b.id] && b.test()) {
      store.badges[b.id] = Date.now();
      got.push(b);
    }
  });
  return got;
}

/* ---------- 連続日数 ---------- */
function dayStr(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function touchStreak() {
  const today = dayStr(new Date());
  if (store.lastDay === today) return;
  const y = new Date();
  y.setDate(y.getDate() - 1);
  store.streakDays = (store.lastDay === dayStr(y)) ? (store.streakDays || 0) + 1 : 1;
  store.lastDay = today;
  save();
}

/* ---------- 共通 ---------- */
function stat(key) {
  if (!store.stats[key]) store.stats[key] = { ok: 0, ng: 0, streak: 0 };
  return store.stats[key];
}
function isWeak(key) {
  const s = store.stats[key];
  return !!s && s.ng > 0 && s.streak < 2;
}
function weakList() { return WORDS.filter(w => isWeak(w.en)); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pool(range) {
  if (range === 'all') return WORDS.slice();
  if (range === 'weak') return weakList();
  return WORDS.filter(w => w.l === range);
}
function normalize(s) {
  return s.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');
}

/* ---------- ホーム ---------- */
function renderHud() {
  const lv = levelOf(store.xp);
  $('hudLv').textContent = 'Lv.' + lv.level;
  $('hudXpFill').style.width = Math.round(lv.inLevel / lv.need * 100) + '%';
  $('hudXpText').textContent = lv.inLevel + ' / ' + lv.need + ' XP';
  $('hudFire').textContent = store.streakDays > 0 ? '🔥' + store.streakDays + '日' : '';
}

function renderBadges() {
  const shelf = $('badgeShelf');
  shelf.innerHTML = '';
  let got = 0;
  BADGES.forEach(b => {
    const has = !!store.badges[b.id];
    if (has) got++;
    const el = document.createElement('div');
    el.className = 'badge' + (has ? ' got' : '');
    el.innerHTML = '<span class="ico">' + b.ico + '</span>' + (has ? b.name : b.desc);
    shelf.appendChild(el);
  });
  $('badgeCount').textContent = got + ' / ' + BADGES.length;
}

function renderHome() {
  renderHud();
  renderBadges();
  $('homeLede').textContent = '全' + WORDS.length + '語。おぼえた単語 ' + knownCount() + ' 語。';
  $('sampleNotice').hidden = !SAMPLE;
  if (SAMPLE) {
    $('sampleNotice').textContent =
      'いまの単語は教科書そのものではなく、中1で広く共通して出てくる基本の単語です。教科書（NEW CROWN）の写真を用意できたら、習った順に並べかえます。記録はそのまま残ります。';
  }

  const ranges = [{ key: 'all', label: '全部' }]
    .concat(GROUPS.map(g => ({ key: g, label: g })))
    .concat([{ key: 'weak', label: '苦手だけ' }]);

  const rc = $('rangeChoices');
  rc.innerHTML = '';
  ranges.forEach(r => {
    const n = pool(r.key).length;
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(setting.range === r.key));
    b.innerHTML = '<span>' + r.label + '</span><span class="count">' + n + '</span>';
    b.disabled = n === 0;
    b.onclick = () => { setting.range = r.key; renderHome(); };
    rc.appendChild(b);
  });

  const max = pool(setting.range).length;
  if (setting.count !== 'all' && max < setting.count) setting.count = 'all';
  const cc = $('countChoices');
  cc.innerHTML = '';
  [10, 20, 'all'].forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c === 'all' ? 'ぜんぶ（' + max + '語）' : c + '語';
    b.disabled = c !== 'all' && max < c;
    b.setAttribute('aria-pressed', String(setting.count === c));
    b.onclick = () => { setting.count = c; renderHome(); };
    cc.appendChild(b);
  });

  Array.from($('modeChoices').children).forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.mode === setting.mode));
    b.onclick = () => { setting.mode = b.dataset.mode; renderHome(); };
  });

  const rate = store.totalAnswered ? Math.round(store.totalCorrect * 100 / store.totalAnswered) : 0;
  $('homeStats').innerHTML =
    '<span><b>' + rate + '%</b>これまでの正答率</span>' +
    '<span><b>' + knownCount() + ' / ' + WORDS.length + '</b>おぼえた単語</span>' +
    '<span><b>' + weakList().length + '</b>苦手</span>' +
    '<span><b>' + store.maxCombo + '</b>さいだいコンボ</span>';

  $('soundBtn').textContent = store.sound ? '音: ON' : '音: OFF';
}

/* ---------- 出題 ---------- */
function show(screen) {
  ['home', 'play', 'result'].forEach(id => { $(id).hidden = id !== screen; });
  window.scrollTo(0, 0);
}

function start(list) {
  touchStreak();
  session = { list: list, i: 0, miss: [], okCount: 0, combo: 0, best: 0, xp: 0, newBadges: [] };
  show('play');
  renderQuestion();
}

function startFromSetting() {
  audioCtx();
  let list = shuffle(pool(setting.range));
  if (setting.count !== 'all') list = list.slice(0, setting.count);
  start(list);
}

function makeOptions(w) {
  const others = [];
  const add = a => {
    if (a !== w.ja && others.indexOf(a) < 0 && others.length < 3) others.push(a);
  };
  shuffle(WORDS.filter(x => x.l === w.l)).forEach(x => add(x.ja));
  shuffle(WORDS).forEach(x => add(x.ja));
  return shuffle(others.concat([w.ja]));
}

function renderCombo(pop) {
  const el = $('combo');
  if (session.combo < 2) { el.innerHTML = ''; el.className = 'combo'; return; }
  el.innerHTML = '<span class="num">' + session.combo + '</span><span class="lbl">COMBO</span>';
  el.className = 'combo' + (pop ? ' pop' : '');
}

function renderQuestion() {
  const w = session.list[session.i];
  $('playCat').textContent = w.l;
  $('playPos').textContent = (session.i + 1) + ' / ' + session.list.length;
  $('playFill').style.width = (session.i / session.list.length * 100) + '%';
  $('playNum').textContent = 'No.' + w.n + (isWeak(w.en) ? '　苦手' : '');
  $('playAnswer').innerHTML = '';
  $('playOptions').innerHTML = '';
  $('playControls').innerHTML = '';
  $('playSay').innerHTML = '';
  renderCombo(false);

  if (setting.mode === 'spell') renderSpell(w);
  else if (setting.mode === 'flash') renderFlash(w);
  else renderQuiz(w);
}

function answer(w, correct, isSpell) {
  const s = stat(w.en);
  store.totalAnswered++;
  const before = levelOf(store.xp).level;
  let gained = 0;

  if (correct) {
    s.ok++; s.streak++;
    session.okCount++;
    session.combo++;
    if (session.combo > session.best) session.best = session.combo;
    if (session.combo > store.maxCombo) store.maxCombo = session.combo;
    store.totalCorrect++;
    if (isSpell) store.spellCorrect++;
    gained = 10 + Math.min(session.combo, 10) * 2 + (isSpell ? 5 : 0);
    store.xp += gained;
    session.xp += gained;
    SFX.ok(session.combo);
  } else {
    s.ng++; s.streak = 0;
    session.combo = 0;
    session.miss.push(w);
    SFX.ng();
    if (navigator.vibrate) navigator.vibrate(40);
  }

  const after = levelOf(store.xp).level;
  if (after > before) showLevelUp(after);
  checkBadges().forEach(b => {
    session.newBadges.push(b);
    if (after <= before) SFX.badge();
  });
  save();
  return gained;
}

function next() {
  session.i++;
  if (session.i < session.list.length) renderQuestion();
  else renderResult();
}

function showLevelUp(level) {
  SFX.level();
  const el = document.createElement('div');
  el.className = 'levelup';
  el.innerHTML = 'LEVEL UP<span class="n">' + level + '</span>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

/* 英語を見て意味を思い出す */
function renderFlash(w) {
  $('playQ').className = 'qtext en';
  $('playQ').textContent = w.en;
  if (canSpeak()) $('playSay').appendChild(sayButton(w.en));

  const reveal = document.createElement('button');
  reveal.className = 'btn';
  reveal.textContent = '意味を見る';
  reveal.onclick = () => {
    $('playAnswer').innerHTML = '<div class="answer">' + w.ja + '</div>';
    const row = document.createElement('div');
    row.className = 'btn-row';
    const ok = document.createElement('button');
    ok.className = 'btn';
    ok.textContent = '○ できた';
    ok.onclick = () => { answer(w, true, false); renderCombo(true); setTimeout(next, 260); };
    const ng = document.createElement('button');
    ng.className = 'btn ghost';
    ng.textContent = '× まちがえた';
    ng.onclick = () => { answer(w, false, false); next(); };
    row.append(ok, ng);
    $('playControls').innerHTML = '';
    $('playControls').appendChild(row);
  };
  $('playControls').appendChild(reveal);
}

/* 英語を見て意味を4択で選ぶ */
function renderQuiz(w) {
  $('playQ').className = 'qtext en';
  $('playQ').textContent = w.en;
  if (canSpeak()) $('playSay').appendChild(sayButton(w.en));

  const opts = makeOptions(w);
  const box = $('playOptions');
  opts.forEach((text, idx) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.innerHTML = '<span class="mark">' + (idx + 1) + '</span><span>' + text + '</span>';
    b.onclick = () => {
      const correct = text === w.ja;
      Array.from(box.children).forEach((el, i) => {
        el.disabled = true;
        if (opts[i] === w.ja) el.classList.add('is-ok');
        else if (i === idx) el.classList.add('is-ng');
      });
      const gained = answer(w, correct, false);
      renderCombo(true);

      const judge = document.createElement('div');
      judge.className = 'judge ' + (correct ? 'ok' : 'ng');
      judge.innerHTML = correct
        ? '<span class="big-mark">○</span>正解！<span class="xp">+' + gained + ' XP</span>'
        : '<span class="big-mark">×</span>正解は<span class="right">' + w.ja + '</span>';

      const nx = document.createElement('button');
      nx.className = 'btn';
      nx.textContent = session.i + 1 < session.list.length ? '次の単語へ' : '結果を見る';
      nx.onclick = next;
      $('playControls').append(judge, nx);
      nx.focus();
    };
    box.appendChild(b);
  });
}

/* 意味を見てスペルを書く */
function renderSpell(w) {
  $('playQ').className = 'qtext';
  $('playQ').textContent = w.ja;

  const form = document.createElement('form');
  form.className = 'spell';
  form.onsubmit = e => { e.preventDefault(); finish(normalize(input.value) === normalize(w.en), input.value); };

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = w.en.replace(/[A-Za-z]/g, '_').split('').join(' ');

  const input = document.createElement('input');
  input.type = 'text';
  input.autocapitalize = 'off';
  input.autocorrect = 'off';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.placeholder = 'ここに英語を入力';

  const submit = document.createElement('button');
  submit.className = 'btn';
  submit.type = 'submit';
  submit.textContent = 'こたえあわせ';

  const giveup = document.createElement('button');
  giveup.className = 'btn quiet';
  giveup.type = 'button';
  giveup.textContent = 'わからない';
  giveup.onclick = () => finish(false, input.value);

  form.append(hint, input, submit, giveup);
  $('playControls').appendChild(form);
  input.focus();

  function finish(correct, typed) {
    input.disabled = true;
    submit.hidden = true;
    giveup.hidden = true;

    const gained = answer(w, correct, true);
    renderCombo(true);

    $('playAnswer').innerHTML = '<div class="answer">' + w.en + '</div>';
    $('playSay').innerHTML = '';
    if (canSpeak()) $('playSay').appendChild(sayButton(w.en));

    const judge = document.createElement('div');
    judge.className = 'judge ' + (correct ? 'ok' : 'ng');
    judge.innerHTML = correct
      ? '<span class="big-mark">○</span>正解！<span class="xp">+' + gained + ' XP</span>'
      : '<span class="big-mark">×</span>ちがいます';
    if (!correct && typed.trim()) {
      const yours = document.createElement('span');
      yours.className = 'yours';
      yours.innerHTML = 'きみの答え: <b>' + typed.trim() + '</b>';
      judge.appendChild(yours);
    }

    const nx = document.createElement('button');
    nx.className = 'btn';
    nx.textContent = session.i + 1 < session.list.length ? '次の単語へ' : '結果を見る';
    nx.onclick = next;
    $('playControls').append(judge, nx);
    nx.focus();
  }
}

/* ---------- 結果 ---------- */
function renderResult() {
  const total = session.list.length;
  const ok = session.okCount;
  if (total >= 10 && ok === total) store.perfectRuns++;
  checkBadges().forEach(b => session.newBadges.push(b));
  save();

  show('result');
  const rate = Math.round(ok * 100 / total);
  $('scoreBig').textContent = rate + '%';
  $('scoreSub').textContent = total + '語中 ' + ok + '語 正解';
  $('resultTitle').textContent = rate === 100 ? 'パーフェクト！' : (rate >= 80 ? 'いい調子' : 'もう一周いこう');
  $('gainXp').textContent = '+' + session.xp;
  $('gainCombo').textContent = session.best;
  $('gainLv').textContent = levelOf(store.xp).level;

  const nb = $('newBadge');
  if (session.newBadges.length) {
    nb.hidden = false;
    nb.innerHTML = '🏅 新しいバッジ！<div class="list">' +
      session.newBadges.map(b => b.ico + ' ' + b.name).join('　') + '</div>';
  } else {
    nb.hidden = true;
  }

  const list = $('missList');
  list.innerHTML = '';
  if (session.miss.length === 0) {
    $('missBlock').hidden = true;
    $('againBtn').hidden = true;
  } else {
    $('missBlock').hidden = false;
    $('againBtn').hidden = false;
    $('againBtn').textContent = 'まちがえた' + session.miss.length + '語をもう一度';
    session.miss.forEach(w => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="n">' + w.n + '</span><span class="q">' + w.en + '</span><span class="a">' + w.ja + '</span>';
      if (canSpeak()) row.appendChild(sayButton(w.en, '🔊'));
      list.appendChild(row);
    });
  }
}

/* ---------- 起動 ---------- */
$('startBtn').onclick = startFromSetting;
$('quitBtn').onclick = () => { renderHome(); show('home'); };
$('homeBtn').onclick = () => { renderHome(); show('home'); };
$('againBtn').onclick = () => start(shuffle(session.miss));
$('soundBtn').onclick = () => {
  store.sound = !store.sound;
  save();
  renderHome();
  if (store.sound) { audioCtx(); SFX.ok(1); }
};
$('resetBtn').onclick = () => {
  if (confirm('レベル・バッジ・正誤の記録をすべて消します。よろしいですか？')) {
    store = blank();
    try { localStorage.removeItem(OLD_KEY); } catch (e) {}
    save();
    renderHome();
  }
};

renderHome();
</script>
