<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0E13">
<title>中学地理 一問一答</title>
<style>
  :root {
    --bg: #0A0E13;
    --surface: #141C25;
    --surface-2: #1C2733;
    --line: #27353F;
    --ink: #E8EFF6;
    --ink-dim: #8697A8;
    --accent: #60A5FA;
    --accent-glow: rgba(96, 165, 250, .45);
    --accent-dim: rgba(96, 165, 250, .12);
    --ok: #4ADE80;
    --ok-glow: rgba(74, 222, 128, .4);
    --ng: #FB7185;
    --gold: #FBBF24;
    --radius: 14px;
    --font-ui: "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, "Noto Sans JP", system-ui, sans-serif;
    --font-num: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(900px 500px at 50% -10%, rgba(96, 165, 250, .10), transparent 70%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 32rem;
    margin: 0 auto;
    padding: 1rem 1rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    min-height: 100vh;
  }

  .screen { display: flex; flex-direction: column; gap: 1.25rem; }
  .screen[hidden] { display: none; }

  /* ---- 上部ステータス ---- */
  .hud {
    display: flex;
    align-items: center;
    gap: .7rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .7rem .85rem;
  }
  .hud .lv {
    font-family: var(--font-num);
    font-size: .95rem;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 14px var(--accent-glow);
    white-space: nowrap;
  }
  .hud .xpwrap { flex: 1; display: flex; flex-direction: column; gap: .25rem; }
  .hud .xpbar {
    height: 6px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
  }
  .hud .xpfill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #BFDBFE);
    box-shadow: 0 0 12px var(--accent-glow);
    transition: width .4s ease;
  }
  .hud .xptext { font-family: var(--font-num); font-size: .68rem; color: var(--ink-dim); }
  .hud .fire {
    font-family: var(--font-num);
    font-size: .8rem;
    color: var(--gold);
    white-space: nowrap;
  }

  /* ---- 見出し ---- */
  .masthead { display: flex; flex-direction: column; gap: .2rem; }
  .eyebrow {
    font-family: var(--font-num);
    font-size: .68rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: .85;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: .02em;
    margin: 0;
    line-height: 1.3;
  }
  .lede { margin: 0; color: var(--ink-dim); font-size: .85rem; }

  /* ---- セクション ---- */
  .field { display: flex; flex-direction: column; gap: .55rem; }
  .field > .label {
    font-size: .7rem;
    letter-spacing: .18em;
    color: var(--ink-dim);
    font-family: var(--font-num);
    text-transform: uppercase;
  }
  .choices { display: flex; flex-wrap: wrap; gap: .45rem; }

  .chip {
    font: inherit;
    font-size: .85rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: .45rem .9rem;
    cursor: pointer;
    display: inline-flex;
    align-items: baseline;
    gap: .4rem;
    transition: border-color .15s, background .15s;
  }
  .chip .count { font-family: var(--font-num); font-size: .72rem; color: var(--ink-dim); }
  .chip[aria-pressed="true"] {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 18px -4px var(--accent-glow);
  }
  .chip[aria-pressed="true"] .count { color: var(--accent); opacity: .8; }
  .chip:disabled { opacity: .35; cursor: default; }

  /* ---- ボタン ---- */
  .btn {
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent), #2563EB);
    color: #071225;
    padding: .95rem 1rem;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 0 24px -6px var(--accent-glow);
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    box-shadow: none;
  }
  .btn.quiet {
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    box-shadow: none;
    font-weight: 500;
  }
  .btn-row { display: flex; gap: .5rem; }
  .btn-row > * { flex: 1; }
  button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- バッジ棚 ---- */
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: .5rem; }
  .badge {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .55rem .3rem;
    text-align: center;
    font-size: .62rem;
    color: var(--ink-dim);
    line-height: 1.4;
  }
  .badge .ico { font-size: 1.3rem; display: block; filter: grayscale(1); opacity: .35; }
  .badge.got {
    border-color: var(--gold);
    background: rgba(251, 191, 36, .08);
    color: var(--gold);
  }
  .badge.got .ico { filter: none; opacity: 1; }

  /* ---- 出題画面 ---- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    font-size: .72rem;
    color: var(--ink-dim);
    font-family: var(--font-num);
  }
  .track { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .track .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #BFDBFE);
    box-shadow: 0 0 10px var(--accent-glow);
    transition: width .3s ease;
  }

  .combo {
    text-align: center;
    font-family: var(--font-num);
    font-weight: 700;
    color: var(--gold);
    min-height: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
  }
  .combo .num { font-size: 1.9rem; line-height: 1; text-shadow: 0 0 18px rgba(251, 191, 36, .6); }
  .combo .lbl { font-size: .7rem; letter-spacing: .2em; }
  .combo.pop .num { animation: pop .28s ease-out; }
  @keyframes pop { 0% { transform: scale(.6); opacity: .3; } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.3rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .qnum { font-family: var(--font-num); font-size: .68rem; color: var(--accent); letter-spacing: .12em; opacity: .8; }
  .qtext { font-size: 1.15rem; line-height: 1.8; margin: 0; font-weight: 500; }
  .answer {
    border-top: 1px solid var(--line);
    padding-top: .9rem;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 22px var(--accent-glow);
  }

  .options { display: flex; flex-direction: column; gap: .5rem; }
  .option {
    font: inherit;
    font-size: .95rem;
    text-align: left;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .85rem .9rem;
    cursor: pointer;
    display: flex;
    gap: .7rem;
    align-items: baseline;
    transition: border-color .15s, background .15s;
  }
  .option .mark { font-family: var(--font-num); color: var(--ink-dim); font-size: .75rem; }
  .option.is-ok {
    background: rgba(74, 222, 128, .14);
    border-color: var(--ok);
    color: var(--ok);
    font-weight: 700;
    box-shadow: 0 0 26px -6px var(--ok-glow);
  }
  .option.is-ng { background: rgba(251, 113, 133, .12); border-color: var(--ng); color: var(--ng); }
  .option:disabled { cursor: default; }

  .judge {
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-wrap: wrap;
    font-size: 1rem;
    font-weight: 700;
    padding: .85rem 1rem;
    border-radius: var(--radius);
    border: 1.5px solid transparent;
  }
  .judge .big-mark { font-size: 1.7rem; line-height: 1; }
  .judge .right { font-weight: 800; }
  .judge .xp { font-family: var(--font-num); font-size: .78rem; margin-left: auto; opacity: .9; }
  .judge.ok { color: var(--ok); background: rgba(74, 222, 128, .12); border-color: var(--ok); }
  .judge.ng { color: var(--ng); background: rgba(251, 113, 133, .1); border-color: var(--ng); }

  /* ---- 結果画面 ---- */
  .score { display: flex; align-items: baseline; gap: .6rem; font-family: var(--font-num); }
  .score .big {
    font-size: 3.4rem;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 30px var(--accent-glow);
  }
  .score .sub { color: var(--ink-dim); font-size: .85rem; }

  .gains { display: flex; gap: .5rem; }
  .gain {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .7rem .5rem;
    text-align: center;
  }
  .gain b { display: block; font-family: var(--font-num); font-size: 1.35rem; color: var(--accent); }
  .gain span { font-size: .66rem; color: var(--ink-dim); }

  .newbadge {
    border: 1.5px solid var(--gold);
    background: rgba(251, 191, 36, .1);
    border-radius: var(--radius);
    padding: .85rem 1rem;
    color: var(--gold);
    font-weight: 700;
    font-size: .9rem;
  }
  .newbadge .list { font-weight: 500; font-size: .82rem; margin-top: .2rem; }

  .review { display: flex; flex-direction: column; }
  .review .row {
    display: grid;
    grid-template-columns: 2.2rem 1fr;
    gap: .2rem .6rem;
    padding: .7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: .85rem;
  }
  .review .row .n { font-family: var(--font-num); font-size: .7rem; color: var(--accent); opacity: .7; grid-row: 1 / span 2; }
  .review .row .q { color: var(--ink-dim); }
  .review .row .a { color: var(--ok); font-weight: 700; }

  .levelup {
    position: fixed;
    left: 50%;
    top: 22%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1.5px solid var(--gold);
    color: var(--gold);
    padding: 1rem 1.6rem;
    border-radius: var(--radius);
    font-weight: 800;
    text-align: center;
    box-shadow: 0 0 40px -8px rgba(251, 191, 36, .7);
    animation: lvin .4s ease-out;
    z-index: 10;
  }
  .levelup .n { font-family: var(--font-num); font-size: 2rem; display: block; }
  @keyframes lvin { from { opacity: 0; transform: translateX(-50%) scale(.7); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 1.1rem;
    font-size: .76rem;
    color: var(--ink-dim);
    border-top: 1px solid var(--line);
    padding-top: .8rem;
  }
  .stats b { display: block; font-family: var(--font-num); font-size: 1rem; color: var(--ink); font-weight: 600; }
  .linkish {
    font: inherit;
    font-size: .76rem;
    background: none;
    border: none;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">

  <!-- ホーム -->
  <section class="screen" id="home">
    <div class="hud">
      <span class="lv" id="hudLv">Lv.1</span>
      <span class="xpwrap">
        <span class="xpbar"><span class="xpfill" id="hudXpFill" style="width:0%"></span></span>
        <span class="xptext" id="hudXpText">0 / 100 XP</span>
      </span>
      <span class="fire" id="hudFire"></span>
    </div>

    <div class="masthead">
      <span class="eyebrow">Chiri 71</span>
      <h1>中学地理 一問一答</h1>
      <p class="lede" id="homeLede"></p>
    </div>

    <div class="field">
      <span class="label">はんい</span>
      <div class="choices" id="rangeChoices"></div>
    </div>

    <div class="field">
      <span class="label">出題数</span>
      <div class="choices" id="countChoices"></div>
    </div>

    <div class="field">
      <span class="label">やり方</span>
      <div class="choices" id="modeChoices">
        <button class="chip" data-mode="flash">答えを思い出す</button>
        <button class="chip" data-mode="quiz">4つから選ぶ</button>
      </div>
    </div>

    <button class="btn" id="startBtn">はじめる</button>

    <div class="field">
      <span class="label">バッジ <span id="badgeCount"></span></span>
      <div class="badges" id="badgeShelf"></div>
    </div>

    <div class="stats" id="homeStats"></div>
    <div class="btn-row">
      <button class="btn quiet" id="soundBtn">音: ON</button>
      <button class="btn quiet" id="resetBtn">記録を消す</button>
    </div>
  </section>

  <!-- 出題 -->
  <section class="screen" id="play" hidden>
    <div class="bar">
      <span id="playCat"></span>
      <span id="playPos"></span>
    </div>
    <div class="track"><div class="fill" id="playFill" style="width:0%"></div></div>

    <div class="combo" id="combo"></div>

    <div class="card">
      <div class="qnum" id="playNum"></div>
      <p class="qtext" id="playQ"></p>
      <div id="playAnswer"></div>
      <div class="options" id="playOptions"></div>
    </div>

    <div id="playControls"></div>
    <button class="btn quiet" id="quitBtn">ホームにもどる</button>
  </section>

  <!-- 結果 -->
  <section class="screen" id="result" hidden>
    <div class="masthead">
      <span class="eyebrow">Result</span>
      <h1 id="resultTitle">おつかれさま</h1>
    </div>

    <div class="score">
      <span class="big" id="scoreBig">0</span>
      <span class="sub" id="scoreSub"></span>
    </div>

    <div class="gains">
      <div class="gain"><b id="gainXp">0</b><span>かくとく XP</span></div>
      <div class="gain"><b id="gainCombo">0</b><span>さいだい コンボ</span></div>
      <div class="gain"><b id="gainLv">1</b><span>いまの レベル</span></div>
    </div>

    <div class="newbadge" id="newBadge" hidden></div>

    <div class="field" id="missBlock">
      <span class="label">まちがえた問題</span>
      <div class="review" id="missList"></div>
    </div>

    <button class="btn" id="againBtn">まちがえた問題をもう一度</button>
    <button class="btn ghost" id="homeBtn">ホームにもどる</button>
  </section>

</div>

<script>
const QUESTIONS = [
  {n:1,c:'A',q:'周りを海に囲まれている国',a:'島国'},
  {n:2,c:'A',q:'周りをすべて陸地に囲まれている国',a:'内陸国'},
  {n:3,c:'A',q:'国と国の境界のこと。',a:'国境'},
  {n:4,c:'A',q:'緯度0度の線のこと。',a:'赤道'},
  {n:5,c:'A',q:'経度0度の線のこと。',a:'本初子午線'},
  {n:6,c:'A',q:'地球をほぼその形のまま小さくした模型のこと。距離、面積、形、方位などを正しく表している。',a:'地球儀'},
  {n:7,c:'A',q:'情報を正しく一度には表せないが、持ち運びに便利で、世界全体を見渡せる図。用途に合わせて様々な種類がある。',a:'世界地図'},
  {n:8,c:'A',q:'その地域の標準時の基準となる経線。',a:'標準時子午線'},
  {n:9,c:'A',q:'ほぼ180度の経線に沿って定められた、日付を決める基準となる線。',a:'日付変更線'},
  {n:10,c:'A',q:'領域のうち、陸地の部分のこと。',a:'領土'},
  {n:11,c:'A',q:'領域のうち、海の部分のこと。',a:'領海'},
  {n:12,c:'A',q:'領域のうち、領土と領海の上空の部分。',a:'領空'},
  {n:13,c:'A',q:'日本の排他的経済水域の海岸線からの範囲（何海里以内か）。',a:'200海里以内'},
  {n:14,c:'A',q:'日本の領海の海岸線からの範囲（何海里以内か）。',a:'12海里以内'},
  {n:15,c:'A',q:'日本の国土面積は約何万km²か。',a:'約38万km²'},
  {n:16,c:'A',q:'各国が守るべき、国同士の関係を定めた法。',a:'国際法'},
  {n:17,c:'A',q:'日本固有の領土だが、ロシアが不法に占拠している島々。',a:'北方領土'},
  {n:18,c:'A',q:'日本固有の領土だが、韓国が不法に占拠している島。',a:'竹島'},
  {n:19,c:'A',q:'日本固有の領土で、領有権の問題もないが、中国船がたびたび領海に不法侵入する諸島。',a:'尖閣諸島'},
  {n:20,c:'A',q:'日本の北端の島',a:'択捉島'},
  {n:21,c:'A',q:'日本の東端の島',a:'南鳥島'},
  {n:22,c:'A',q:'日本の西端の島',a:'与那国島'},
  {n:23,c:'A',q:'日本の南端の島',a:'沖ノ鳥島'},

  {n:24,c:'B',q:'一年中、気温が高い気候帯',a:'熱帯'},
  {n:25,c:'B',q:'降水量が少ない気候帯',a:'乾燥帯'},
  {n:26,c:'B',q:'温暖で四季がはっきりしている気候帯',a:'温帯'},
  {n:27,c:'B',q:'夏が短く、冬の寒さが厳しい気候帯',a:'亜寒帯（冷帯）'},
  {n:28,c:'B',q:'気温が低く、樹木がほとんど育たない気候帯',a:'寒帯'},
  {n:29,c:'B',q:'熱帯のうち、一年中雨が多く、気温が高い気候。',a:'熱帯雨林気候'},
  {n:30,c:'B',q:'熱帯のうち、雨季と乾季がはっきりと分かれている気候。',a:'サバナ気候'},
  {n:31,c:'B',q:'乾燥帯のうち、非常に雨が少なく、広大な砂漠が広がる気候。',a:'砂漠気候'},
  {n:32,c:'B',q:'乾燥帯のうち、少しだけ雨が降り、草原が広がる気候。',a:'ステップ気候'},
  {n:33,c:'B',q:'温帯のうち、冬と夏の気温差が大きく、1年を通して降水量が多い気候。',a:'温暖湿潤気候'},
  {n:34,c:'B',q:'温帯のうち、偏西風や暖流の影響を受けて1年を通して気温と降水量の差が小さい気候。',a:'西岸海洋性気候'},
  {n:35,c:'B',q:'温帯のうち、冬に比較的雨が多く、夏に雨が極端に少なく乾燥する気候。',a:'地中海性気候'},
  {n:36,c:'B',q:'亜寒帯（冷帯）のうち、短い夏と寒さの厳しい冬があり、夏と冬の気温差が大きい気候。',a:'亜寒帯気候'},
  {n:37,c:'B',q:'寒帯のうち、1年中寒さが厳しく、樹木が育たない地域で、夏の間だけ、地表の氷がとけ、コケ類が広がる気候。',a:'ツンドラ気候'},
  {n:38,c:'B',q:'寒帯のうち、1年中氷と雪に覆われる気候。',a:'氷雪気候'},

  {n:39,c:'C',q:'熱帯地方で午後から夕方にかけて発生する、激しい雨を伴う強風',a:'スコール'},
  {n:40,c:'C',q:'熱帯に見られる、背の高い樹木がうっそうとしげった森林',a:'熱帯林'},
  {n:41,c:'C',q:'乾燥した地域の中でも湧き水や井戸があって水が得られる場所',a:'オアシス'},
  {n:42,c:'C',q:'農作物に水を与えるために、河川や湖などから水路を通して引き、農地を潤すこと。',a:'かんがい'},
  {n:43,c:'C',q:'草や水を求めて、季節に応じて移動しながら家畜を飼育すること。',a:'遊牧'},

  {n:51,c:'D',q:'熱帯のサバナ気候でみられる、1年のうちで、降水量の多い時期のこと',a:'雨季'},
  {n:52,c:'D',q:'熱帯のサバナ気候でみられる、1年のうちで、降水量の少ない時期のこと',a:'乾季'},
  {n:53,c:'D',q:'インドのガンジス川流域や中国南部、東南アジアの平野などで行われている稲を栽培すること。',a:'稲作'},

  {n:60,c:'D',q:'一極集中が進んでいる、韓国の首都',a:'ソウル'},

  {n:62,c:'D',q:'同じ土地で、一年に2回、同じ作物をつくること。',a:'二期作'},
  {n:63,c:'D',q:'東南アジアでみられる、輸出用の商品作物を栽培する大農園',a:'プランテーション'},
  {n:64,c:'D',q:'東南アジアの国のほとんどが加盟している、東南アジア諸国連合の略称（アルファベット）',a:'ASEAN'},
  {n:65,c:'D',q:'人口が増えた大都市で、貧しい人々が集まる生活環境の悪い住宅',a:'スラム'},
  {n:66,c:'D',q:'インターネットなどの普及により成長している、情報や通信技術を用いた産業',a:'ICT（情報通信技術）産業'},
  {n:67,c:'D',q:'インドのデカン高原で栽培が盛んな農産物',a:'綿花'},
  {n:68,c:'D',q:'原油や天然ガスなど、液体や気体を長距離輸送するための管状の施設。',a:'パイプライン'},
  {n:69,c:'D',q:'西アジアを中心とした産油国の利益を守るために結成された国際組織。',a:'OPEC（石油輸出国機構）'},
  {n:70,c:'D',q:'埋蔵量が非常に少ない、ニッケル・コバルト・クロムなどの希少金属',a:'レアメタル'},
  {n:71,c:'D',q:'戦争や災害によって、今まで住んでいた国を離れなければならなくなった人々。',a:'難民'}
];

const CATS = {
  A: '世界と日本のすがた',
  B: '世界の気候',
  C: 'くらしと宗教',
  D: 'アジア州'
};

const TESTS = {};

const KEY = 'chiri.v2';
const OLD_KEY = 'chiri71.v1';
const $ = id => document.getElementById(id);

/* ---------- 保存 ---------- */
function blank() {
  return {
    v: 2, stats: {}, xp: 0, badges: {}, maxCombo: 0,
    totalAnswered: 0, totalCorrect: 0, perfectRuns: 0,
    streakDays: 0, lastDay: '', sound: true
  };
}
function load() {
  const s = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(s, JSON.parse(raw));
    const old = localStorage.getItem(OLD_KEY);
    if (old) s.stats = (JSON.parse(old).stats) || {};
  } catch (e) {}
  return s;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
}

let store = load();
let setting = { range: 'all', count: 10, mode: 'flash' };
let session = null;

/* ---------- 音（ファイル不要。その場で合成する） ---------- */
let ac = null;
function audioCtx() {
  if (ac) return ac;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ac = new AC();
  } catch (e) { ac = null; }
  return ac;
}
function beep(freqs, dur, type, vol) {
  if (!store.sound) return;
  const c = audioCtx();
  if (!c) return;
  if (c.state === 'suspended') c.resume();
  freqs.forEach((f, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.value = f;
    const t = c.currentTime + i * dur * 0.55;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  });
}
const SFX = {
  ok(combo) {
    const base = 620 * Math.pow(1.055, Math.min(combo, 12));
    beep([base, base * 1.5], 0.13, 'triangle', 0.15);
  },
  ng() { beep([200, 150], 0.17, 'sawtooth', 0.09); },
  level() { beep([523, 659, 784, 1047], 0.16, 'triangle', 0.15); },
  badge() { beep([880, 1175, 1568], 0.15, 'sine', 0.13); }
};

/* ---------- レベル ---------- */
function levelOf(xp) {
  let lv = 1, acc = 0, need = 100;
  while (xp >= acc + need) { acc += need; lv++; need = 100 + (lv - 1) * 50; }
  return { level: lv, inLevel: xp - acc, need: need };
}

/* ---------- バッジ ---------- */
function catDone(c) {
  const list = QUESTIONS.filter(q => q.c === c);
  return list.length > 0 && list.every(q => (store.stats[q.q] || {}).ok > 0);
}
const BADGES = [
  { id: 'first',   ico: '🌱', name: 'はじめの一歩', desc: '1問こたえる',        test: () => store.totalAnswered >= 1 },
  { id: 'q50',     ico: '📘', name: '50問',         desc: 'のべ50問',          test: () => store.totalAnswered >= 50 },
  { id: 'q200',    ico: '📚', name: '200問',        desc: 'のべ200問',         test: () => store.totalAnswered >= 200 },
  { id: 'q500',    ico: '🏛️', name: '500問',        desc: 'のべ500問',         test: () => store.totalAnswered >= 500 },
  { id: 'combo10', ico: '🔥', name: '10れんぞく',   desc: '10問連続で正解',    test: () => store.maxCombo >= 10 },
  { id: 'combo20', ico: '⚡', name: '20れんぞく',   desc: '20問連続で正解',    test: () => store.maxCombo >= 20 },
  { id: 'perfect', ico: '💯', name: 'ノーミス',     desc: '10問以上を全問正解', test: () => store.perfectRuns >= 1 },
  { id: 'lv5',     ico: '⭐', name: 'レベル5',      desc: 'レベル5になる',     test: () => levelOf(store.xp).level >= 5 },
  { id: 'lv10',    ico: '🌟', name: 'レベル10',     desc: 'レベル10になる',    test: () => levelOf(store.xp).level >= 10 },
  { id: 'day3',    ico: '📅', name: '3日れんぞく',  desc: '3日続けて勉強',     test: () => store.streakDays >= 3 },
  { id: 'day7',    ico: '🗓️', name: '7日れんぞく',  desc: '7日続けて勉強',     test: () => store.streakDays >= 7 },
  { id: 'catA',    ico: '🗾', name: '日本のすがた', desc: '世界と日本のすがたを全問正解', test: () => catDone('A') },
  { id: 'catB',    ico: '🌦️', name: '世界の気候', desc: '世界の気候を全問正解', test: () => catDone('B') },
  { id: 'catC',    ico: '⛩️', name: 'くらしと宗教', desc: 'くらしと宗教を全問正解', test: () => catDone('C') },
  { id: 'catD',    ico: '🌏', name: 'アジア州', desc: 'アジア州を全問正解', test: () => catDone('D') }
];
function checkBadges() {
  const got = [];
  BADGES.forEach(b => {
    if (!store.badges[b.id] && b.test()) {
      store.badges[b.id] = Date.now();
      got.push(b);
    }
  });
  return got;
}

/* ---------- 連続日数 ---------- */
function dayStr(d) {
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function touchStreak() {
  const today = dayStr(new Date());
  if (store.lastDay === today) return;
  const y = new Date();
  y.setDate(y.getDate() - 1);
  store.streakDays = (store.lastDay === dayStr(y)) ? (store.streakDays || 0) + 1 : 1;
  store.lastDay = today;
  save();
}

/* ---------- 共通 ---------- */
function stat(key) {
  if (!store.stats[key]) store.stats[key] = { ok: 0, ng: 0, streak: 0 };
  return store.stats[key];
}
function isWeak(key) {
  const s = store.stats[key];
  return !!s && s.ng > 0 && s.streak < 2;
}
function weakList() { return QUESTIONS.filter(q => isWeak(q.q)); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pool(range) {
  if (range === 'all') return QUESTIONS.slice();
  if (range === 'weak') return weakList();
  if (TESTS[range]) return QUESTIONS.filter(q => TESTS[range].cats.indexOf(q.c) >= 0);
  return QUESTIONS.filter(q => q.c === range);
}

/* ---------- ホーム ---------- */
function renderHud() {
  const lv = levelOf(store.xp);
  $('hudLv').textContent = 'Lv.' + lv.level;
  $('hudXpFill').style.width = Math.round(lv.inLevel / lv.need * 100) + '%';
  $('hudXpText').textContent = lv.inLevel + ' / ' + lv.need + ' XP';
  $('hudFire').textContent = store.streakDays > 0 ? '🔥' + store.streakDays + '日' : '';
}

function renderBadges() {
  const shelf = $('badgeShelf');
  shelf.innerHTML = '';
  let got = 0;
  BADGES.forEach(b => {
    const has = !!store.badges[b.id];
    if (has) got++;
    const el = document.createElement('div');
    el.className = 'badge' + (has ? ' got' : '');
    el.innerHTML = '<span class="ico">' + b.ico + '</span>' + (has ? b.name : b.desc);
    shelf.appendChild(el);
  });
  $('badgeCount').textContent = got + ' / ' + BADGES.length;
}

function renderHome() {
  renderHud();
  renderBadges();
  $('homeLede').textContent = '重要語句一問一答、全' + QUESTIONS.length + '問。';

  const ranges = [
    { key: 'all', label: '全部' },
    { key: 'A', label: CATS.A },
    { key: 'B', label: CATS.B },
    { key: 'C', label: CATS.C },
    { key: 'D', label: CATS.D },
    { key: 'weak', label: '苦手だけ' }
  ];
  const rc = $('rangeChoices');
  rc.innerHTML = '';
  ranges.forEach(r => {
    const n = pool(r.key).length;
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(setting.range === r.key));
    b.innerHTML = '<span>' + r.label + '</span><span class="count">' + n + '</span>';
    b.disabled = n === 0;
    b.onclick = () => { setting.range = r.key; renderHome(); };
    rc.appendChild(b);
  });

  const max = pool(setting.range).length;
  if (setting.count !== 'all' && max < setting.count) setting.count = 'all';
  const cc = $('countChoices');
  cc.innerHTML = '';
  [10, 20, 'all'].forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c === 'all' ? 'ぜんぶ（' + max + '問）' : c + '問';
    b.disabled = c !== 'all' && max < c;
    b.setAttribute('aria-pressed', String(setting.count === c));
    b.onclick = () => { setting.count = c; renderHome(); };
    cc.appendChild(b);
  });

  Array.from($('modeChoices').children).forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.mode === setting.mode));
    b.onclick = () => { setting.mode = b.dataset.mode; renderHome(); };
  });

  const done = Object.keys(store.stats).length;
  const rate = store.totalAnswered ? Math.round(store.totalCorrect * 100 / store.totalAnswered) : 0;
  $('homeStats').innerHTML =
    '<span><b>' + rate + '%</b>これまでの正答率</span>' +
    '<span><b>' + done + ' / ' + QUESTIONS.length + '</b>やった問題</span>' +
    '<span><b>' + weakList().length + '</b>苦手</span>' +
    '<span><b>' + store.maxCombo + '</b>さいだいコンボ</span>';

  $('soundBtn').textContent = store.sound ? '音: ON' : '音: OFF';
}

/* ---------- 出題 ---------- */
function show(screen) {
  ['home', 'play', 'result'].forEach(id => { $(id).hidden = id !== screen; });
  window.scrollTo(0, 0);
}

function start(list) {
  touchStreak();
  session = { list: list, i: 0, miss: [], okCount: 0, combo: 0, best: 0, xp: 0, newBadges: [] };
  show('play');
  renderQuestion();
}

function startFromSetting() {
  audioCtx();
  let list = shuffle(pool(setting.range));
  if (setting.count !== 'all') list = list.slice(0, setting.count);
  start(list);
}

function makeOptions(q) {
  const others = [];
  const add = a => {
    if (a !== q.a && others.indexOf(a) < 0 && others.length < 3) others.push(a);
  };
  shuffle(QUESTIONS.filter(x => x.c === q.c)).forEach(x => add(x.a));
  shuffle(QUESTIONS).forEach(x => add(x.a));
  return shuffle(others.concat([q.a]));
}

function renderCombo(pop) {
  const el = $('combo');
  if (session.combo < 2) { el.innerHTML = ''; el.className = 'combo'; return; }
  el.innerHTML = '<span class="num">' + session.combo + '</span><span class="lbl">COMBO</span>';
  el.className = 'combo' + (pop ? ' pop' : '');
}

function renderQuestion() {
  const q = session.list[session.i];
  $('playCat').textContent = CATS[q.c];
  $('playPos').textContent = (session.i + 1) + ' / ' + session.list.length;
  $('playFill').style.width = (session.i / session.list.length * 100) + '%';
  $('playNum').textContent = 'No.' + q.n + (isWeak(q.q) ? '　苦手' : '');
  $('playQ').textContent = q.q;
  $('playAnswer').innerHTML = '';
  $('playOptions').innerHTML = '';
  $('playControls').innerHTML = '';
  renderCombo(false);

  if (setting.mode === 'flash') renderFlash(q);
  else renderQuiz(q);
}

/* 記録・音・コンボ・レベル。画面は進めない */
function answer(q, correct) {
  const s = stat(q.q);
  store.totalAnswered++;
  const before = levelOf(store.xp).level;

  if (correct) {
    s.ok++; s.streak++;
    session.okCount++;
    session.combo++;
    if (session.combo > session.best) session.best = session.combo;
    if (session.combo > store.maxCombo) store.maxCombo = session.combo;
    store.totalCorrect++;
    const gain = 10 + Math.min(session.combo, 10) * 2;
    store.xp += gain;
    session.xp += gain;
    SFX.ok(session.combo);
  } else {
    s.ng++; s.streak = 0;
    session.combo = 0;
    session.miss.push(q);
    SFX.ng();
    if (navigator.vibrate) navigator.vibrate(40);
  }

  const after = levelOf(store.xp).level;
  if (after > before) showLevelUp(after);

  checkBadges().forEach(b => {
    session.newBadges.push(b);
    if (after <= before) SFX.badge();
  });
  save();
  return correct ? (10 + Math.min(session.combo, 10) * 2) : 0;
}

function next() {
  session.i++;
  if (session.i < session.list.length) renderQuestion();
  else renderResult();
}

function showLevelUp(level) {
  SFX.level();
  const el = document.createElement('div');
  el.className = 'levelup';
  el.innerHTML = 'LEVEL UP<span class="n">' + level + '</span>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

function renderFlash(q) {
  const reveal = document.createElement('button');
  reveal.className = 'btn';
  reveal.textContent = '答えを見る';
  reveal.onclick = () => {
    $('playAnswer').innerHTML = '<div class="answer">' + q.a + '</div>';
    const row = document.createElement('div');
    row.className = 'btn-row';
    const ok = document.createElement('button');
    ok.className = 'btn';
    ok.textContent = '○ できた';
    ok.onclick = () => { answer(q, true); renderCombo(true); setTimeout(next, 260); };
    const ng = document.createElement('button');
    ng.className = 'btn ghost';
    ng.textContent = '× まちがえた';
    ng.onclick = () => { answer(q, false); next(); };
    row.append(ok, ng);
    $('playControls').innerHTML = '';
    $('playControls').appendChild(row);
  };
  $('playControls').appendChild(reveal);
}

function renderQuiz(q) {
  const opts = makeOptions(q);
  const box = $('playOptions');
  opts.forEach((text, idx) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.innerHTML = '<span class="mark">' + (idx + 1) + '</span><span>' + text + '</span>';
    b.onclick = () => {
      const correct = text === q.a;
      Array.from(box.children).forEach((el, i) => {
        el.disabled = true;
        if (opts[i] === q.a) el.classList.add('is-ok');
        else if (i === idx) el.classList.add('is-ng');
      });
      const gained = answer(q, correct);
      renderCombo(true);

      const judge = document.createElement('div');
      judge.className = 'judge ' + (correct ? 'ok' : 'ng');
      judge.innerHTML = correct
        ? '<span class="big-mark">○</span>正解！<span class="xp">+' + gained + ' XP</span>'
        : '<span class="big-mark">×</span>正解は<span class="right">' + q.a + '</span>';

      const nx = document.createElement('button');
      nx.className = 'btn';
      nx.textContent = session.i + 1 < session.list.length ? '次の問題へ' : '結果を見る';
      nx.onclick = next;

      $('playControls').append(judge, nx);
      nx.focus();
    };
    box.appendChild(b);
  });
}

/* ---------- 結果 ---------- */
function renderResult() {
  const total = session.list.length;
  const ok = session.okCount;
  if (total >= 10 && ok === total) store.perfectRuns++;
  checkBadges().forEach(b => session.newBadges.push(b));
  save();

  show('result');
  const rate = Math.round(ok * 100 / total);
  $('scoreBig').textContent = rate + '%';
  $('scoreSub').textContent = total + '問中 ' + ok + '問 正解';
  $('resultTitle').textContent = rate === 100 ? 'パーフェクト！' : (rate >= 80 ? 'いい調子' : 'もう一周いこう');
  $('gainXp').textContent = '+' + session.xp;
  $('gainCombo').textContent = session.best;
  $('gainLv').textContent = levelOf(store.xp).level;

  const nb = $('newBadge');
  if (session.newBadges.length) {
    nb.hidden = false;
    nb.innerHTML = '🏅 新しいバッジ！<div class="list">' +
      session.newBadges.map(b => b.ico + ' ' + b.name).join('　') + '</div>';
  } else {
    nb.hidden = true;
  }

  const list = $('missList');
  list.innerHTML = '';
  if (session.miss.length === 0) {
    $('missBlock').hidden = true;
    $('againBtn').hidden = true;
  } else {
    $('missBlock').hidden = false;
    $('againBtn').hidden = false;
    $('againBtn').textContent = 'まちがえた' + session.miss.length + '問をもう一度';
    session.miss.forEach(q => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="n">' + q.n + '</span><span class="q">' + q.q + '</span><span class="a">' + q.a + '</span>';
      list.appendChild(row);
    });
  }
}

/* ---------- 起動 ---------- */
$('startBtn').onclick = startFromSetting;
$('quitBtn').onclick = () => { renderHome(); show('home'); };
$('homeBtn').onclick = () => { renderHome(); show('home'); };
$('againBtn').onclick = () => start(shuffle(session.miss));
$('soundBtn').onclick = () => {
  store.sound = !store.sound;
  save();
  renderHome();
  if (store.sound) { audioCtx(); SFX.ok(1); }
};
$('resetBtn').onclick = () => {
  if (confirm('レベル・バッジ・正誤の記録をすべて消します。よろしいですか？')) {
    store = blank();
    try { localStorage.removeItem(OLD_KEY); } catch (e) {}
    save();
    renderHome();
  }
};

renderHome();
</script>
